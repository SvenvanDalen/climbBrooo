import org.jsonschema2pojo.DefaultGenerationConfig
import org.jsonschema2pojo.GenerationConfig
import org.jsonschema2pojo.Jackson2Annotator
import org.jsonschema2pojo.SchemaGenerator
import org.jsonschema2pojo.SchemaMapper
import org.jsonschema2pojo.SchemaStore
import org.jsonschema2pojo.rules.RuleFactory
import com.sun.codemodel.JCodeModel

plugins {
    id 'com.android.application'
}

android {
    namespace 'nl.paree.climbpro'
    compileSdk 34

    defaultConfig {
        applicationId 'nl.paree.climbpro'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        // Strava OAuth — read from local.properties (untracked).
        // Add to local.properties:
        //   strava.client.id=<your-client-id>
        //   strava.client.secret=<your-client-secret>
        def localProps = new Properties()
        def localPropsFile = rootProject.file('local.properties')
        if (localPropsFile.exists()) {
            localProps.load(new FileInputStream(localPropsFile))
        }
        def stravaClientId = localProps.getProperty('strava.client.id', '')
        def stravaClientSecret = localProps.getProperty('strava.client.secret', '')
        buildConfigField 'String', 'STRAVA_CLIENT_ID', "\"${stravaClientId}\""
        buildConfigField 'String', 'STRAVA_CLIENT_SECRET', "\"${stravaClientSecret}\""
        manifestPlaceholders = [
                appAuthRedirectScheme: "climbpro"
        ]
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    // Expose protocol/ on the test classpath so ProtocolRoundTripTest can load
    // schema.json and the example payloads as resources. The .md files in
    // protocol/ ride along harmlessly; the test only loads .json files.
    sourceSets {
        test {
            resources.srcDirs += "${rootDir}/../protocol"
        }
    }
}

// jsonschema2pojo codegen — generates Java POJOs from protocol/schema.json.
// Source of truth is ../../protocol/schema.json. Never edit generated sources by hand.
//
// We invoke jsonschema2pojo's Java API directly instead of using the Gradle plugin,
// because the plugin (1.2.1) is incompatible with AGP 8.x.
//
// jsonschema2pojo derives the root class name from the source file's base name
// (schema.json → Schema, ClimbPayload.json → ClimbPayload). We copy the canonical
// schema.json to a temp file named ClimbPayload.json so the generated root class
// matches what the rest of the code expects.
def schemaFile = file("${rootDir}/../protocol/schema.json")
def generatedSrcDir = file("${project.buildDir}/generated/source/jsonschema2pojo/main")
def schemaStageDir = file("${project.buildDir}/tmp/jsonschema2pojo-stage")
def stagedSchemaFile = new File(schemaStageDir, 'ClimbPayload.json')

tasks.register('generateProtocolPojos') {
    inputs.file(schemaFile).optional()
    outputs.dir(generatedSrcDir)
    onlyIf { schemaFile.exists() }
    doLast {
        schemaStageDir.mkdirs()
        generatedSrcDir.mkdirs()

        // Copy schema.json → ClimbPayload.json so the generated root class is
        // named ClimbPayload instead of Schema.
        stagedSchemaFile.text = schemaFile.text

        GenerationConfig config = new DefaultGenerationConfig() {
            @Override boolean isGenerateBuilders() { true }
            @Override boolean isUseLongIntegers() { false }
            @Override boolean isIncludeAdditionalProperties() { false }
            @Override boolean isIncludeJsr303Annotations() { false }
            @Override boolean isInitializeCollections() { true }
            @Override boolean isIncludeHashcodeAndEquals() { true }
            @Override boolean isIncludeToString() { true }
            @Override org.jsonschema2pojo.SourceType getSourceType() { org.jsonschema2pojo.SourceType.JSONSCHEMA }
        }
        SchemaMapper mapper = new SchemaMapper(
                new RuleFactory(config, new Jackson2Annotator(config), new SchemaStore()),
                new SchemaGenerator())
        JCodeModel codeModel = new JCodeModel()
        mapper.generate(codeModel, 'ClimbPayload', 'nl.paree.climbpro.protocol', stagedSchemaFile.toURI().toURL())
        codeModel.build(generatedSrcDir)
    }
}

// Wire the codegen task into application variants (debug / release app compilation).
android.applicationVariants.configureEach { variant ->
    variant.registerJavaGeneratingTask(
            tasks.named('generateProtocolPojos').get(),
            generatedSrcDir)
}

// Wire the codegen task into unit-test compilation.
// registerJavaGeneratingTask only covers app variants; we must add the generated
// source dir to the test source set and declare the task dependency explicitly so
// that compileDebugUnitTestJavaWithJavac (and the release equivalent) can see
// ClimbPayload and friends.
android.sourceSets.test.java.srcDirs += generatedSrcDir
tasks.whenTaskAdded { task ->
    if (task.name ==~ /compile.*UnitTest.*JavaWithJavac/) {
        task.dependsOn('generateProtocolPojos')
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.12.0'

    // Lifecycle / MVVM
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.4'

    // Background work
    implementation 'androidx.work:work-runtime:2.9.1'

    // Encrypted preferences (for Strava refresh token)
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // OAuth
    implementation 'net.openid:appauth:0.11.1'

    // HTTP / JSON
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-jackson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.17.2'

    // Garmin Connect IQ Mobile SDK is added manually as a .aar — see SETUP.md.
    // implementation files('libs/ciq-mobile-sdk.aar')

    // UI — RecyclerView and Preference (used by SettingsViewModel / SettingsActivity)
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.preference:preference:1.2.1'

    // Tests
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testImplementation 'com.networknt:json-schema-validator:1.5.1'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'org.robolectric:robolectric:4.13'

    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
