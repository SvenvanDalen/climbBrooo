name: preflight
on:
  push:
  pull_request:
jobs:
  jvm-gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run JVM tests (unit + protocol round-trip + lockstep + Monkey C source guard)
        run: ./gradlew test --console=plain
