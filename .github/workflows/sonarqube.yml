name: sonarqube
# Static analysis + unit-test coverage on SonarQube Cloud (free for public repos, including
# branch/PR analysis and PR decoration). Needs repo secret SONAR_TOKEN; organization and
# project key live in android/app/build.gradle. Automatic Analysis must be OFF in the
# SonarQube Cloud project, because this CI-based scan replaces it.
on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [staging, main]
  workflow_dispatch:

jobs:
  sonar:
    # Fork PRs get no secrets, so the scan could only fail there.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so SonarQube can blame lines and detect new code.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Unit tests + coverage + SonarQube Cloud scan
        run: ./gradlew jacocoUnitTestReport sonar --console=plain "-Dsonar.qualitygate.wait=true"
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # AppAuth rejects an empty client id; see preflight.yml.
          STRAVA_CLIENT_ID: ci-placeholder
