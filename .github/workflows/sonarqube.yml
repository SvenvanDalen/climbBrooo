name: sonarqube
# Static analysis + unit-test coverage against a SonarQube server running locally in Docker.
# GitHub-hosted runners cannot reach localhost, so this job needs a self-hosted runner on the
# same machine, plus repo secrets SONAR_TOKEN and SONAR_HOST_URL (http://localhost:9000).
# Community Build keeps a single branch, so every scan overwrites the previous result; the
# quality gate still fails the check when it turns red.
on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [staging]
  workflow_dispatch:

jobs:
  sonar:
    # Fork PRs must never execute on the self-hosted machine.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: self-hosted
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so SonarQube can blame lines and detect new code.
          fetch-depth: 0
      - name: Unit tests + coverage + SonarQube scan
        shell: pwsh
        run: ./gradlew jacocoUnitTestReport sonar --console=plain "-Dsonar.qualitygate.wait=true"
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          # AppAuth rejects an empty client id; see preflight.yml.
          STRAVA_CLIENT_ID: ci-placeholder
